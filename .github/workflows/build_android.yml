name: Compilar APK de Android
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Versión ideal para empaquetados estables de Flet v0.23

    - name: Configurar Java (Requerido para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2' # Forzamos el SDK clásico de Flutter que no exige licencias rotas
        channel: 'stable'

    - name: Instalar dependencias de Python Estables
      run: |
        python -m pip install --upgrade pip
        pip uninstall -y flet flet-cli serious-python
        pip install flet==0.23.2 # 🍊 Forzamos la versión clásica de Flet que sí funcionaba perfectamente
        pip install -r requirements.txt || true

    - name: Limpieza Física de Residuos
      run: |
        rm -rf build
        rm -rf __pycache__

    - name: Build APK
      run: |
        # 🍊 Ejecutamos el empaquetado clásico directo que no genera errores de tuberías rotas
        flet build apk






  
   

    
