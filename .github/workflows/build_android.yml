name: Compilar APK de Android
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java (Requerido para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 🍊 Firmamos legalmente todas las licencias del SDK de Android antes del proceso
    - name: Aceptar Licencias de Android Oficiales
      run: |
        yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses || true

    # 🍊 Usamos el comando doble para forzar a Flet a avanzar sin pedir confirmaciones por consola
    - name: Compilar la APK con Flet
      run: |
        flet build apk --yes --no-interactive

    - name: Guardar la aplicación compilada
      uses: actions/upload-artifact@v4
      with:
        name: app-tanques-release
        path: build/apk/*.apk




  
   

    
