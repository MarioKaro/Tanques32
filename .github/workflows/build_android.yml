name: Compilar APK de Android
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java (Requerido para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8' # 🍊 Forzamos la versión exacta que te pide Flet
        channel: 'stable'

    # 🍊 Aceptar licencias de Android de forma automática para evitar bloqueos silenciosos
    - name: Aceptar Licencias de Android
      run: |
        yes | sdkmanager --licenses || true

    - name: Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build APK
      run: |
        yes | flet build apk # 🍊 Tu comando no interactivo ya está listo

    - name: Guardar la aplicación compilada
      uses: actions/upload-artifact@v4
      with:
        name: app-tanques-release
        path: build/apk/*.apk






  
   

    
