name: Compilar APK de Android
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Configurar Java (Requerido para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8' # 🍊 Dejamos la versión que exige Flet de forma obligatoria
        channel: 'stable'

    - name: Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Aceptar Licencias de Android (Flutter)
      run: |
        yes | flutter doctor --android-licenses

    - name: Limpieza de Residuos
      run: |
        rm -rf build
        rm -rf __pycache__

    - name: Build APK
      run: |
        # 🍊 Usamos el pipe para responder automáticamente "y" a la inicialización de Flet
        echo "y" | flet build apk --python-version 3.12







  
   

    
