name: Compilar APK de Android
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java (Requerido para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 🍊 Aceptamos las licencias del SDK de Android antes de compilar
    - name: Aceptar Licencias de Android
      run: |
        yes | sdkmanager --licenses || true

    # 🍊 Forzamos a Flet a usar el comando con aprobación de licencias automática
    - name: Compilar la APK con Flet
      run: |
        flet build apk --yes


  
   

    
