name: Compilar APK de Android
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Configurar Java (Requerido para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Instalar dependencias del Servidor
      run: |
        python -m pip install --upgrade pip
        pip install flet serious_python

    - name: Aceptar Licencias de Android
      run: |
        yes | flutter doctor --android-licenses

    - name: Limpieza Radical de Residuos
      run: |
        rm -rf build
        find . -type d -name "__pycache__" -exec rm -rf {} +

    - name: Pre-empaquetar código fuente de Python
      run: |
        python -m serious_python package . --exclude build --exclude .git --exclude .github

    - name: Compilar APK de forma Nativa con Flutter
      run: |
        cd build/flutter
        flutter build apk --release

    - name: Guardar la aplicación compilada
      uses: actions/upload-artifact@v4
      with:
        name: app-tanques-release
        path: build/flutter/build/app/outputs/flutter-apk/*.apk








  
   

    
