name: Compilar APK de Android
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Configurar Java (Requerido para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Instalar dependencias del Servidor
      run: |
        python -m pip install --upgrade pip
        pip install flet

    - name: Aceptar Licencias de Android (Flutter)
      run: |
        yes | flutter doctor --android-licenses

    - name: Limpieza Total de Residuos
      run: |
        rm -rf build
        find . -type d -name "__pycache__" -exec rm -rf {} +

    # 🍊 Inicializamos un proyecto real de Flutter nativo mediante comandos oficiales de Google
    - name: Crear Estructura Base de la App (Flutter)
      run: |
        mkdir -p build
        flutter create --platforms=android build/flutter

    # 🍊 Añadimos y empaquetamos las fuentes de Python localmente
    - name: Empaquetar Fuentes de Python
      run: |
        cd build/flutter
        # Agregamos serious_python de forma local al pubspec.yaml existente
        flutter pub add serious_python
        
        # Preparamos la carpeta intermedia con tu código fuente de Tanques
        mkdir -p app
        cp -r ../../* app/ 2>/dev/null || true
        rm -rf app/build app/.git app/.github app/venv app/.venv
        
        # Ejecutamos el empaquetador dentro del entorno del proyecto móvil
        dart run serious_python:main package app

    # 🍊 Compilación nativa directa que generará tu APK limpia
    - name: Compilar APK con Flutter Nativo
      run: |
        cd build/flutter
        flutter build apk --release

    - name: Guardar la aplicación compilada
      uses: actions/upload-artifact@v4
      with:
        name: app-tanques-release
        path: build/flutter/build/app/outputs/flutter-apk/*.apk












  
   

    
