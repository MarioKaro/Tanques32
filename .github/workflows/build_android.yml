name: Compilar APK de Android
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Configurar Java (Requerido para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Instalar dependencias del Servidor
      run: |
        python -m pip install --upgrade pip
        pip install flet

    - name: Aceptar Licencias de Android (Flutter)
      run: |
        yes | flutter doctor --android-licenses

    - name: Limpieza Total de Residuos
      run: |
        rm -rf build
        find . -type d -name "__pycache__" -exec rm -rf {} +

    # 🍊 Inicializamos la estructura de Flutter de forma nativa tal como lo hace Flet
    - name: Crear Estructura Base de la App
      run: |
        flet create app_dir
        # Movemos los archivos generados a la raíz de compilación esperada
        mkdir -p build/flutter
        cp -r app_dir/* build/flutter/ || true
        rm -rf app_dir

    # 🍊 Empaquetamos el código de Python usando Dart directamente para evitar el bug de Flet-cli
    - name: Empaquetar Fuentes de Python
      run: |
        cd build/flutter
        dart pub global activate serious_python
        # Agregamos la ruta de dart al PATH del entorno actual
        export PATH="$PATH":"$HOME/.pub-cache/bin"
        # Movemos tu código fuente al directorio temporal de empaquetado móvil, ignorando residuos
        mkdir -p app
        cp -r ../../../* app/ 2>/dev/null || true
        rm -rf app/build app/.git app/.github app/venv app/.venv
        # Compilamos las fuentes de forma manual
        dart pub global run serious_python:main package app

    # 🍊 Compilación final usando el motor nativo de Google que nos dará el log detallado si falla
    - name: Compilar APK con Flutter Nativo
      run: |
        cd build/flutter
        flutter build apk --release

    - name: Guardar la aplicación compilada
      uses: actions/upload-artifact@v4
      with:
        name: app-tanques-release
        path: build/flutter/build/app/outputs/flutter-apk/*.apk









  
   

    
