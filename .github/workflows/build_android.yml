name: Compilar APK de Android
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Configurar Java (Requerido para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Instalar dependencias de Python en el Servidor
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Aceptar Licencias de Android (Flutter)
      run: |
        yes | flutter doctor --android-licenses

    # 🍊 Renombrar temporalmente para evitar que Flet intente meter paquetes incompatibles al APK
    - name: Aislar Requirements
      run: |
        if [ -f requirements.txt ]; then mv requirements.txt temp_requirements.txt; fi

    - name: Build APK
      run: |
        echo "y" | flet build apk --python-version 3.12

    # 🍊 Restaurar el archivo para que tu repositorio no quede modificado
    - name: Restaurar Requirements
      if: always()
      run: |
        if [ -f temp_requirements.txt ]; then mv temp_requirements.txt requirements.txt; fi

    - name: Guardar la aplicación compilada
      uses: actions/upload-artifact@v4
      with:
        name: app-tanques-release
        path: build/apk/*.apk







  
   

    
