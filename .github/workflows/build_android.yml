name: Compilar APK de Android
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Configurar Java (Requerido para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Aceptar Licencias de Android (Flutter)
      run: |
        yes | flutter doctor --android-licenses

    # 🍊 Limpieza del archivo de dependencias para asegurar compatibilidad móvil limpia
    - name: Limpiar dependencias para el APK
      run: |
        echo "flet" > requirements.txt

    # 🍊 Comando limpio oficial para Flet en servidores que autoconfigura el SDK
    - name: Build APK
      run: |
        echo "y" | flet build apk --python-version 3.12

    - name: Guardar la aplicación compilada
      uses: actions/upload-artifact@v4
      with:
        name: app-tanques-release
        path: build/apk/*.apk







  
   

    
